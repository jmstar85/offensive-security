<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OSA Platform">
  <!--
    Concept A — "terminal prompt >_"
    A bold command-line chevron + block cursor, reading the product as a
    CLI-driven autonomous agent rather than a passive scanner. Two shapes
    only (chevron stroke + cursor block) so it survives 16px favicon size.
    Accent: red (matches current primary token, hsl(0 72% 51%)).
  -->
  <defs>
    <linearGradient id="a-glyph" x1="16" y1="14" x2="53" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="32" cy="32" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="#020617"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="32" cy="32" r="27" fill="url(#a-glow)"/>

  <!-- chevron ">" -->
  <path d="M20 17 L36 32 L20 47" fill="none" stroke="url(#a-glyph)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- block cursor -->
  <rect x="40" y="38" width="13" height="9" rx="2" fill="url(#a-glyph)"/>
</svg>
