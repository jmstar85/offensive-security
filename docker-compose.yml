services:
  postgres:
    # pgvector/pgvector:pg16 ships the same PG 16 server as postgres:16-alpine
    # plus the `vector` extension required by Alembic migration 005_pgvector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/osa_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEBUG: "true"
      # v4.0 PentAGI port — activates the new /flow/:id 2-pane shell + tabs
      # and the DeprecationBanner on Monitor/PentestWorkflow/AgentCatalog.
      # Default in code is False; this override enables the new UI.
      OSA_FLOW_UI_ENABLED: "true"
      # Kali coexistence (PR-7) — KaliBackend ONLY talks to the proxy chain
      # (image filter -> docker-socket-proxy -> dockerd). DockerBackend keeps
      # the direct host-socket mount unchanged per Principle 5.
      KALI_DOCKER_HOST: tcp://kali-socket-proxy-filter:2375
      DOCKER_TLS_VERIFY: ""
      DOCKER_CERT_PATH: ""
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - osa-net

  # Kali coexistence (PR-7) image-regex middleware in front of the tecnativa
  # proxy. KaliBackend's docker client targets THIS service; the middleware
  # rejects POST /containers/create whose Image is not `^osa-kali(:|@)`.
  kali-socket-proxy-filter:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # uvicorn --factory requires a zero-arg callable; create_app keeps the
    # upstream_url argument explicit for unit tests, so we target the env-
    # driven wrapper env_app_factory which reads SOCKET_PROXY_UPSTREAM.
    command: ["uvicorn", "app.infra.socket_proxy_filter:env_app_factory",
              "--factory", "--host", "0.0.0.0", "--port", "2375",
              "--app-dir", "/app"]
    environment:
      SOCKET_PROXY_UPSTREAM: http://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    expose:
      - "2375"

  # Endpoint-allowlist proxy in front of dockerd. Only the 6 endpoints the
  # KaliBackend client uses are exposed; everything else returns 403. Image
  # body inspection is layered on top by kali-socket-proxy-filter (PR-7
  # split: tecnativa enforces verb+path, our middleware enforces body).
  docker-socket-proxy:
    # Digest pin (architect P1 + plan A2.5/R8): a security-critical proxy
    # must never float on a mutable tag. The digest below is the one the
    # current 0.3.0 release publishes; refresh via the quarterly workflow.
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      INFO: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  mitmproxy:
    build:
      context: ./docker/mitmproxy
      args:
        OSA_MITMPROXY_DIGEST: ${OSA_MITMPROXY_DIGEST}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - backend
    networks:
      - osa-net

  headless-browser:
    build:
      context: ./docker/headless-browser
      args:
        OSA_HEADLESS_DIGEST: ${OSA_HEADLESS_DIGEST}
    depends_on:
      - backend
    networks:
      - osa-net

  interactsh:
    build:
      context: ./docker/interactsh
      args:
        OSA_INTERACTSH_DIGEST: ${OSA_INTERACTSH_DIGEST}
    networks:
      - osa-oob-net

volumes:
  postgres_data:

networks:
  osa-net:
    driver: bridge
  osa-oob-net:
    driver: bridge
    internal: false
