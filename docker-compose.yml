services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/osa_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      # LLM Provider: "copilot" (Enterprise, free), "anthropic", or "github"
      LLM_PROVIDER: ${LLM_PROVIDER:-copilot}
      # Copilot Enterprise (auto-detects gh CLI token if empty)
      COPILOT_TOKEN: ${COPILOT_TOKEN:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-claude-sonnet-4.6}
      # Anthropic (direct API — usage-based billing)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # GitHub Models (use GitHub PAT)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
