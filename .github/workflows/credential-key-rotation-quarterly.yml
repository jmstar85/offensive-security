name: Credential Fernet Key Rotation (Quarterly)
on:
  schedule:
    # 03:00 UTC on the first day of Jan/Apr/Jul/Oct
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch: {}
jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint new Fernet key via KMS
        run: |
          echo "Step 1: provision new key via KMS GenerateDataKey"
          echo "Step 2: append to OSA_CREDENTIAL_FERNET_KEYRING (current-first)"
          echo "Step 3: redeploy backend with new keyring"
          echo "Step 4: trigger re-encryption job (background)"
          echo "Step 5: after 24h grace, purge tail key beyond MAX_KEY_RING_SIZE"
      - name: Verify MultiFernet decrypts existing credentials
        run: echo "smoke test against staging"
      - name: Audit-log the rotation
        run: echo "POST /internal/audit-log action=credential.fernet_key_rotated"
