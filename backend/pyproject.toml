[project]
name = "offensive-security-agent"
version = "0.1.0"
description = "AI-powered autonomous penetration testing platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1,>=3.2",
    "anthropic>=0.40.0",
    "docker>=7.1.0",
    "python-multipart>=0.0.12",
    "weasyprint>=63.0",
    "python-nmap>=0.7.1",
    "httpx>=0.28.0",
    "websockets>=14.0",
    # --- v4.0 PentAGI port additions (P1 Foundation) ---
    # pgvector extension client for SQLAlchemy (memory_entries table, hnsw index)
    "pgvector>=0.3.0,<0.4.0",
    # Local embeddings (all-MiniLM-L6-v2, 384-dim) — no external API dependency
    "sentence-transformers>=3.0.0,<4.0.0",
    # torch CPU-only (install with --extra-index-url https://download.pytorch.org/whl/cpu in deploy)
    "torch>=2.3.0,<2.5.0",
    # numpy ABI compatibility with torch 2.3/2.4 + pgvector
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
