# Curated regex catalog for secret_scan entrypoint.
# Format: { name, pattern, severity, false_positive_keywords[] }
patterns:
  - name: aws_access_key_id
    pattern: 'AKIA[0-9A-Z]{16}'
    severity: high
  - name: aws_secret_access_key
    pattern: '(?i)aws.{0,20}?[''"][0-9a-zA-Z/+]{40}[''"]'
    severity: critical
  - name: github_personal_token
    pattern: 'ghp_[A-Za-z0-9]{36}'
    severity: high
  - name: github_oauth_token
    pattern: 'gho_[A-Za-z0-9]{36}'
    severity: high
  - name: github_app_token
    pattern: 'ghs_[A-Za-z0-9]{36}'
    severity: high
  - name: github_fine_grained_pat
    pattern: 'github_pat_[A-Za-z0-9_]{82}'
    severity: high
  - name: slack_bot_token
    pattern: 'xox[abps]-[A-Za-z0-9-]{10,}'
    severity: high
  - name: slack_webhook
    pattern: 'https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'
    severity: medium
  - name: anthropic_api_key
    pattern: 'sk-ant-(api03|admin01)-[A-Za-z0-9_\-]{93,}'
    severity: high
  - name: openai_api_key
    pattern: 'sk-[A-Za-z0-9]{48}'
    severity: high
  - name: openai_project_key
    pattern: 'sk-proj-[A-Za-z0-9_\-]{40,}'
    severity: high
  - name: huggingface_token
    pattern: 'hf_[A-Za-z0-9]{34}'
    severity: medium
  - name: stripe_live_secret
    pattern: 'sk_live_[A-Za-z0-9]{24,}'
    severity: critical
  - name: stripe_test_secret
    pattern: 'sk_test_[A-Za-z0-9]{24,}'
    severity: low
  - name: google_api_key
    pattern: 'AIza[0-9A-Za-z\-_]{35}'
    severity: high
  - name: gcp_service_account_email
    pattern: '[A-Za-z0-9._-]+@[A-Za-z0-9-]+\.iam\.gserviceaccount\.com'
    severity: medium
  - name: gcp_oauth_client_id
    pattern: '[0-9]+-[A-Za-z0-9_]+\.apps\.googleusercontent\.com'
    severity: low
  - name: azure_storage_key
    pattern: '(?i)AccountKey=[A-Za-z0-9+/=]{60,}'
    severity: critical
  - name: azure_connection_string
    pattern: 'DefaultEndpointsProtocol=https;AccountName=[a-z0-9]+;AccountKey='
    severity: critical
  - name: jwt
    pattern: 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
    severity: low
  - name: pem_private_key
    pattern: '-----BEGIN (RSA |EC |DSA |OPENSSH |)PRIVATE KEY-----'
    severity: critical
  - name: ssh_private_key_marker
    pattern: '-----BEGIN OPENSSH PRIVATE KEY-----'
    severity: critical
  - name: pgp_private_key
    pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    severity: high
  - name: pkcs8_private_key
    pattern: '-----BEGIN ENCRYPTED PRIVATE KEY-----'
    severity: high
  - name: docker_hub_token
    pattern: 'dckr_pat_[A-Za-z0-9_\-]{20,}'
    severity: high
  - name: npm_token
    pattern: 'npm_[A-Za-z0-9]{36}'
    severity: high
  - name: pypi_token
    pattern: 'pypi-AgEIcHlwaS5vcmcC[A-Za-z0-9_\-]{20,}'
    severity: high
  - name: gitlab_pat
    pattern: 'glpat-[A-Za-z0-9_\-]{20}'
    severity: high
  - name: atlassian_api_token
    pattern: 'ATATT3xFfGF0[A-Za-z0-9_\-]{20,}'
    severity: high
  - name: datadog_api_key
    pattern: '(?i)dd[_-]?api[_-]?key.{0,5}[''"][a-f0-9]{32}[''"]'
    severity: high
  - name: sendgrid_api_key
    pattern: 'SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}'
    severity: high
  - name: twilio_account_sid
    pattern: 'AC[a-f0-9]{32}'
    severity: medium
  - name: twilio_auth_token
    pattern: '(?i)twilio.{0,20}?[''"][a-f0-9]{32}[''"]'
    severity: high
  - name: cloudflare_api_token
    pattern: '(?i)cloudflare.{0,20}?[''"][A-Za-z0-9_\-]{40}[''"]'
    severity: high
  - name: heroku_api_key
    pattern: '(?i)heroku.{0,20}?[''"][0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[''"]'
    severity: high
  - name: mailgun_api_key
    pattern: 'key-[a-f0-9]{32}'
    severity: medium
  - name: mailchimp_api_key
    pattern: '[a-f0-9]{32}-us[0-9]{1,2}'
    severity: high
  - name: jdbc_url_with_creds
    pattern: 'jdbc:[a-z]+://[^:]+:[^@]+@[^/]+/'
    severity: critical
  - name: postgres_url_with_creds
    pattern: '(postgres|postgresql)://[^:]+:[^@]+@[^/]+/'
    severity: critical
  - name: mysql_url_with_creds
    pattern: 'mysql://[^:]+:[^@]+@[^/]+/'
    severity: critical
  - name: mongodb_url_with_creds
    pattern: 'mongodb(\+srv)?://[^:]+:[^@]+@'
    severity: critical
  - name: redis_url_with_creds
    pattern: 'redis://[^:]+:[^@]+@'
    severity: high
  - name: amqp_url_with_creds
    pattern: 'amqp://[^:]+:[^@]+@'
    severity: high
  - name: linkedin_oauth
    pattern: '(?i)linkedin.{0,20}?[''"][a-zA-Z0-9_\-]{20,}[''"]'
    severity: medium
  - name: facebook_oauth
    pattern: 'EAA[A-Za-z0-9]{50,}'
    severity: medium
  - name: discord_bot_token
    pattern: '[MN][A-Za-z\d]{23}\.[A-Za-z\d-_]{6}\.[A-Za-z\d-_]{27}'
    severity: high
  - name: vault_token
    pattern: 'hvs\.[A-Za-z0-9_\-]{20,}'
    severity: critical
  - name: ssh_authorized_keys_marker
    pattern: 'ssh-(rsa|ed25519|dss|ecdsa) [A-Za-z0-9+/]+={0,3} ?[^\n]*'
    severity: low
